# Frozen strong-RGB scene, new multiscale head, official labels + independently trained DINOv3.
# Requires complete train-only pseudo_strong_v1 export matching the manifest exactly.
# Supervised train-track evidence takes priority over contradictory fused teacher targets.
seed: 42
manifest: artifacts/prepared/manifest.json
output: runs/strong_joint_semantic
warmstart: runs/strong_rgb/last.pt
warmstart_reset_refiner: true
refiner:
  type: multiscale
  channels: 64
  residual_bound: 6.0
  context: pyramid_strip
freeze_geometry: true
freeze_rgb: true
train_labeled_only: false
view_sampling: shuffle
independent_view_rng: true
steps: 8000
train_scale: 1.0
progressive_resolution: false
semantic_start: 1
refine_start: 1
semantic_weight: 1.0
semantic_geometry_weight: 0.0
class_weight_power: 0.25
pseudo_dir: artifacts/pseudo_strong_v1
multiview_fusion: true
optimize_cameras: false
densification: none
region_rgb_weight: 0.0
log_every: 50
save_every: 1000
eval_every: 1000
eval_scale: 1.0
pseudo_threshold: 0.8
pseudo_weight: 0.1
pseudo_refiner_weight: 0.1
pseudo_class_reweight_cap: 3.0
projection_uncertainty: true
multiview_weight: 0.05
fusion_every: 200
fusion_points: 4096
local_teacher_kd: true
supervised_teacher_priority: true
