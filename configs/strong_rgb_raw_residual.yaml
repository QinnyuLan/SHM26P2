# Exact residual attribution ablation: same hybrid scoring, budget, PCA and sampling.
# Uses raw RGB residuals and unit camera-quality weights; runtime still differs from Jacobian diagnostics.
seed: 42
manifest: artifacts/prepared/manifest.json
output: runs/strong_rgb_raw_residual
steps: 30000
background_points: 2000
train_scale: 1.0
progressive_resolution: true
view_sampling: shuffle
semantic_start: 1000000
refine_start: 1000000
semantic_weight: 0.0
semantic_geometry_weight: 0.0
pseudo_dir: null
multiview_fusion: false
region_rgb_weight: 0.15
sh_interval: 1000
optimize_cameras: false
camera_stop: 0
densification: hybrid
densify_start: 500
densify_stop: 24000
densify_every: 100
diagnostic_every: 20
densify_min_views: 2
absgrad_threshold: 0.0006
residual_threshold: 0.02
hybrid_residual_weight: 0.35
structure_guided: true
max_gaussians: 500000
max_splits: 12000
densify_fraction: 0.06
density_budget_schedule: linear
foreground_allocation_fraction: 0.65
clone_scale_fraction: 0.002
split_screen_radius: 0.015
split_opacity_mode: preserve
shrink_unstructured_all_axes: true
prune_opacity: 0.005
recycle_count: 500
opacity_reset_every: 6000
opacity_reset_start: 6000
opacity_reset_stop: 18001
opacity_reset_cap: 0.03
opacity_reset_pause: 400
log_every: 50
save_every: 3000
eval_every: 3000
eval_scale: 1.0
absgrad_quantile: 0.85
absgrad_threshold_floor: 5.0e-05
absgrad_support_threshold: 5.0e-05
camera_attribution: false
camera_quality_weighting: false
