# New semantic stage: frozen geometry/RGB, official TRAIN labels only, new refiner/optimizers.
# Set warmstart to a completed strong RGB checkpoint (or an existing checkpoint for a diagnostic).
seed: 42
manifest: artifacts/prepared/manifest.json
output: runs/strong_rgb_semantic
warmstart: runs/strong_rgb/last.pt
warmstart_reset_refiner: true
refiner:
  type: multiscale
  channels: 64
  residual_bound: 6.0
  context: pyramid_strip
freeze_geometry: true
freeze_rgb: true
train_labeled_only: true
view_sampling: shuffle
steps: 8000
train_scale: 1.0
progressive_resolution: false
semantic_start: 1
refine_start: 1
semantic_weight: 1.0
semantic_geometry_weight: 0.0
class_weight_power: 0.25
pseudo_dir: null
multiview_fusion: false
optimize_cameras: false
densification: none
region_rgb_weight: 0.0
log_every: 50
save_every: 1000
eval_every: 1000
eval_scale: 1.0
